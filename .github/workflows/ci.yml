name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats jq shellcheck

      - name: Validate
        run: |
          test -x skills/review-fix-verify/rfv-prep.sh
          make lint test
